<!-- Splash -->
<div id="splash">
  <div class="lg">
    <b>
      <i>
        <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" width="36" height="36">
          <circle cx="24" cy="16" r="7" stroke="#fff" stroke-width="2.5" fill="none"/>
          <line x1="24" y1="23" x2="24" y2="42" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="14" y1="30" x2="34" y2="30" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
      </i>
      CLEO HR
    </b>
    <span id="splash-type"></span>
  </div>
</div>
<script>
(function(){
  const txt = 'Human Resources Management';
  const el  = document.getElementById('splash-type');
  let i = 0;
  setTimeout(function type(){
    if(!el) return;
    el.textContent = txt.slice(0, i++);
    if(i <= txt.length) setTimeout(type, 60);
  }, 600);
})();
</script>


<!-- App Shell -->
<div id="shell">

  <!-- Sidebar -->
  <aside id="sidebar">
    <div id="sidebar-brand">
      <div class="brand-icon">
        <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="18" cy="13" r="6" stroke="#f5d78e" stroke-width="2" fill="none"/>
          <line x1="18" y1="19" x2="18" y2="30" stroke="#f5d78e" stroke-width="2" stroke-linecap="round"/>
          <line x1="12" y1="23" x2="24" y2="23" stroke="#f5d78e" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <b>CLEO HR</b>
        <small>إدارة الموارد البشرية</small>
      </div>
    </div>
    <nav id="nav"></nav>
    <div id="sidebar-footer">
      <div class="user-chip" id="user-chip"></div>
    </div>
  </aside>

  <!-- Main -->
  <div id="main-wrap">
    <header id="top"></header>
    <main id="root"></main>
  </div>

</div>
