<link rel="preconnect" href="https://fonts.googleapis.com">

<!-- Splash -->
<div id="splash">
  <div class="lg">
    <div class="lg-icon">
      <svg viewBox="0 0 90 90" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Eye of Horus stylized -->
        <ellipse cx="45" cy="45" rx="38" ry="38" stroke="#c9933a" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.4"/>
        <ellipse cx="45" cy="45" rx="28" ry="28" stroke="#c9933a" stroke-width="1" opacity="0.3"/>
        <!-- Ankh cross -->
        <circle cx="45" cy="32" r="9" stroke="#f5d78e" stroke-width="2.5" fill="none"/>
        <line x1="45" y1="41" x2="45" y2="68" stroke="#f5d78e" stroke-width="2.5" stroke-linecap="round"/>
        <line x1="34" y1="52" x2="56" y2="52" stroke="#f5d78e" stroke-width="2.5" stroke-linecap="round"/>
        <!-- Gold dots -->
        <circle cx="45" cy="10" r="2.5" fill="#c9933a" opacity="0.8"/>
        <circle cx="45" cy="80" r="2.5" fill="#c9933a" opacity="0.8"/>
        <circle cx="10" cy="45" r="2.5" fill="#c9933a" opacity="0.8"/>
        <circle cx="80" cy="45" r="2.5" fill="#c9933a" opacity="0.8"/>
      </svg>
    </div>
    <b>CLEO <span>HR</span></b>
    <em>Human Resources Management</em>
  </div>
</div>

<!-- App Shell -->
<div id="shell">

  <!-- Sidebar -->
  <aside id="sidebar">
    <div id="sidebar-brand">
      <div class="brand-icon">
        <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="18" cy="13" r="6" stroke="#f5d78e" stroke-width="2" fill="none"/>
          <line x1="18" y1="19" x2="18" y2="30" stroke="#f5d78e" stroke-width="2" stroke-linecap="round"/>
          <line x1="12" y1="23" x2="24" y2="23" stroke="#f5d78e" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div>
        <b>CLEO HR</b>
        <small>إدارة الموارد البشرية</small>
      </div>
    </div>
    <nav id="nav"></nav>
    <div id="sidebar-footer">
      <div class="user-chip" id="user-chip"></div>
    </div>
  </aside>

  <!-- Main -->
  <div id="main-wrap">
    <header id="top"></header>
    <main id="root"></main>
  </div>

</div>
